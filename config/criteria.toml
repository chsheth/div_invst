# Thresholds and macro inputs for the screening criteria (docs/criteria/ideas_v2.md). Percent values are fractions.
# Edit here, not in code. Macro values are refreshed by hand until the data layer pulls FRED and SPY.

[macro]
as_of = "2026-10-22"
sp_yield = 0.010          # S&P 500 dividend yield; Argus Top 30 issue, October 2026 (replace with SPY yield from yfinance)
treasury_10y = 0.0496     # FRED DGS10, 2026-10-22
inflation = 0.0372        # FRED CPIAUCSL year over year, September 2026

[yield]                   # criterion 4
min_multiple = 1.5        # yield / S&P yield
max_multiple = 2.5        # above this still passes, flagged "yield trap?"

[chowder]                 # criteria 5 and 6
min_yield_vs_sp = 0.5     # yield >= 50% of the S&P yield
tier_default = 0.12       # most stocks with yield >= 3%
tier_low_yield = 0.15     # yield below 3% (tech and growth)
tier_utility_telecom = 0.08
low_yield_cutoff = 0.03
acn_yield_cap = 0.10
acn_growth_cap = 0.15
acn_min_terms = 2         # of D, E, R that must be available

[valuation]               # criterion 9
max_ps = 1.5
max_pb = 3.0
min_cash_to_market_cap = 0.05
min_subtests = 3          # evaluable sub-tests needed for a pass

[quality]                 # criteria 2, 3, 15
pass_score = 70           # criterion 3 composite score
min_subscores = 3         # of 4
governance_pass = ["Leader", "Average"]
agreement_min_sources = 3
agreement_pass = 0.25
ibes_buy_at_most = 2.0
ibes_sell_at_least = 3.0

[reit]                    # criteria 1 and 3: payout is dividends paid / FFO proxy (validated 2026-10-26 on O and PLD)
max_ffo_payout = 0.85     # O 76% and PLD 68% reported; the proxy carries about +/-10% error, so the margin is kept

[starmine]                # criterion 13
pass_levels = ["Bullish", "Very Bullish"]
neutral_pass_if_change = ["Moderate Increase", "Large Increase"]

[history]                 # criterion 7
min_dividend_years = 5    # non-CCC names: yfinance streak (a screen only; CCC names pass through the DRIP band)
earnings_window = 10      # EPS year-over-year comparisons looked at
earnings_up_years = 7     # up years needed out of the window (scaled down when fewer comparisons exist)
min_comparisons = 8       # fewer than this is unknown
one_off_swing = 0.40      # EPS moving this much from both neighbours, in opposite directions, is a one-off year

[insider]                 # criterion 12 (Finnhub codes P and S, last 183 days)
min_buyers = 2            # different insiders buying on the open market; net shares must also be positive

[revision]                # criterion 13 second signal: 0-10 proxy from yfinance snapshots
pass_score = 7.0
min_components = 2
eps_rev_90d_full = 0.10   # a 90-day estimate change of +/- this maps to 10 / 0
target_upside_full = 0.20 # price-target upside of +/- this maps to 10 / 0
weights = { eps_rev_90d = 0.4, revision_balance = 0.2, grade_balance = 0.2, recommendation = 0.1, target_upside = 0.1 }

[ranking]
min_coverage = 0.70       # evaluated criteria / applicable implemented criteria
top_n = 50

[refresh]                 # data layer: refetch when the newest snapshot is older than this many days (docs/research/data_sources.md section 4)
yf_info = 1               # price, yield, valuation, 5-yr average yield
yf_dividends = 7
yf_revisions = 1          # point-in-time analyst data: keep a snapshot every day
fh_metric = 7             # annual series and current metrics
fh_insider = 1
yf_splits = 30           # to restate EDGAR per-share history
edgar = 7                 # annual facts change only at 10-K filing
fred = 1
